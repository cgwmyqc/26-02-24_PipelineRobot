; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.partitions = ../partitions_ota.csv      # 引入自定义的OTA分区表，实现OTA功能，如果想取消OTA分区，需要显式的指定board_build.partitions = default.csv

board_microros_transport = custom
board_microros_distro = humble                              
board_microros_user_meta = fixed_part_microros.meta

lib_deps = https://github.com/micro-ROS/micro_ros_platformio.git
    ; https://gitee.com/fishros/micro_ros_platformio.git          # 引入microros的Platformio

;Windows
; monitor_port = COM7
; monitor_speed = 115200

;Ubuntu
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
