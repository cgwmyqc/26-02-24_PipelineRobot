server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pipeline-robot-web-srv
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:pipeline_robot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  mvc:
    static-path-pattern: /static/**

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:PipelineRobotJwtSecretKeyForDevOnly1234567890}
    expiration-seconds: ${JWT_EXPIRE_SECONDS:86400}
  storage:
    root-dir: ${STORAGE_ROOT:storage}
    video-dir: ${VIDEO_DIR:videos}
    image-dir: ${IMAGE_DIR:images}
    points-dir: ${POINTS_DIR:points}
    results-dir: ${RESULTS_DIR:results}
    sessions-dir: ${SESSIONS_DIR:.sessions}
    ota-dir: ${OTA_DIR:ota}
    pipe-dataset-root: ${PIPE_DATASET_ROOT:/home/hit/pipe_dataset}
    public-url-prefix: /api/files
    ota-public-base-url: ${OTA_PUBLIC_BASE_URL:http://192.168.1.132:8080/api}
    ffmpeg-bin: ${FFMPEG_BIN:/usr/bin/ffmpeg}
    camera-rtsp-url: ${CAMERA_RTSP_URL:rtsp://test:hitzri123@192.168.1.64:554/Streaming/Channels/101}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.132:5173}
